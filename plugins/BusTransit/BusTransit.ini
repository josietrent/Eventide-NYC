[General]
; Set to 0 to disable the Bus Transit plugin without removing the ASI
Enabled=1

; Flat bus ticket fare deducted upon boarding ($)
Fare=5

; How long the bus waits at each bus stop (milliseconds)
DwellMs=7000

; Cruise speed along the Portland loop (GTA III CAutopilot units, 12-18 recommended)
CruiseSpeed=15

; 0 = City Bus (bus, ID 121) only | 1 = Alternate Bus (121) and Coach (127)
UseCoachAlt=0

; 1 = Allow boarding any stopped traffic Bus/Coach anywhere as a passenger
AllowAmbientBuses=1

[Controls]
; Win32 Virtual-Key codes (hex or decimal)
; 0x47 = G (Board near door / Request Stop or Exit while riding)
BoardKey=0x47
; 0x4E = N (Trip Skip to next bus stop while riding)
SkipKey=0x4E
