[PauseMusic]
; Path to an MP3 or 16-bit PCM WAV file, OR a folder containing MP3/WAV files.
; Relative paths resolve from modloader\Eventide first, then the GTA III root folder.
; Note: If Path is empty here, PauseMusic will also check a PauseMusic.ini in the GTA III root folder
; (useful so 'deno task install' does not overwrite your custom path).
Path=audio\EC\rain.MP3

; Volume percentage relative to GTA III's in-game Music Volume slider (0..100).
Volume=80

; Smooth fade durations in milliseconds (0 = instant).
FadeInMs=1000
FadeOutMs=1000

; 1 = resume from where the track left off across pauses, 0 = restart from 0:00.
ResumePosition=1

; 1 = shuffle tracks when Path points to a folder, 0 = play alphabetically.
Shuffle=1

; 1 = also play on the title/main menu, 0 = only while paused in-game (Esc / Map).
PlayOnMainMenu=1
