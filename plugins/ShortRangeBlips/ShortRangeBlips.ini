[General]
; Maximum normalized radar distance before short-range blips hide (1.0 = minimap rim)
MaxRadarDist=1.0

[Display]
; Set to 0 to turn blips completely off on the minimap, 1 to show them
ShowBusStops=1
ShowWeapons=1
ShowSprayShops=1
ShowBombs=1

[ShortRange]
; Set to 1 to hide blips beyond MaxRadarDist, 0 to always show them on the minimap edge
BusStops=1
Weapons=1
SprayShops=1
Bombs=1
